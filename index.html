<style>
/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  color-scheme:dark;
  --back:#000; --front:#fff; --muted:#7d7d7d;
  --spacing:1rem; --leading:1rem;
  --display:"Archivo","Arial Black","Helvetica Neue",sans-serif;
  --body:"Jost","Futura","Century Gothic","Trebuchet MS",sans-serif;
  --safe-top:env(safe-area-inset-top,0px);
  --ease-out:cubic-bezier(.2,.7,.2,1);
}
@media (min-width:48em){:root{--spacing:2rem;--leading:2rem}}
@media (min-width:64em){:root{--spacing:3rem;--leading:4rem}}
@media (min-width:80em){:root{--spacing:4rem}}
html,body{margin:0;min-height:100%;background:var(--back);color:var(--front)}
body{font-family:var(--body);font-weight:300;line-height:1.25;-webkit-font-smoothing:antialiased}
body.menu-open{overflow:hidden}
a{color:inherit;text-decoration:none}
ul{list-style:none;margin:0;padding:0}
h1,h2,h3,p,blockquote,figure{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block;max-width:100%}
:focus-visible{outline:.125rem dotted var(--muted);outline-offset:.2rem;border-radius:.25rem}
.v-h{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.title{font-family:var(--display);font-weight:800;letter-spacing:.1875em;text-transform:uppercase;line-height:1.15;text-wrap:balance}
.title--xl{font-size:clamp(2rem,6vw,3rem)}
.title--page{opacity:.75;--o:.75}

/* ---------- header, burger, menu ---------- */
.mh{position:absolute;top:0;left:0;right:0;z-index:20;padding:calc(1rem + var(--safe-top)) 1rem 1rem var(--spacing);pointer-events:none}
.mh__logo{pointer-events:auto;display:inline-block;max-width:14rem;font-size:1.5rem;letter-spacing:.25em;text-transform:uppercase;line-height:1.2;opacity:.75;transition:opacity .25s linear}
.mh__logo:hover,.mh__logo:focus-visible{opacity:1}

.burger{position:fixed;right:1rem;top:calc(1rem + var(--safe-top));z-index:40;width:1.75rem;height:1.75rem;padding:.125rem;opacity:.75;transition:opacity .25s linear}
.burger:hover,.burger:focus-visible{opacity:1}
.burger svg{display:block;width:1.5rem;height:1.5rem}
.burger rect{fill:currentColor;transition:transform .3s ease,opacity .1s ease}
.burger .s1{transform-origin:2px 6px}
.burger .s3{transform-origin:2px 26px}
.menu-open .burger .s1{transform:translateX(4px) rotate(45deg)}
.menu-open .burger .s2{opacity:0}
.menu-open .burger .s3{transform:translateX(4px) rotate(-45deg)}

.menu{position:fixed;inset:0;z-index:30;isolation:isolate;display:flex;align-items:center;justify-content:center;padding:2rem 1rem;background:var(--back);opacity:0;visibility:hidden;transition:opacity .25s linear,visibility .25s linear}
.menu-open .menu{opacity:1;visibility:visible}
.menu__bg{position:absolute;inset:0;z-index:-1;width:100%;height:100%;object-fit:cover;filter:brightness(.4);pointer-events:none}
.menu ul{position:relative;display:grid;gap:.5rem;text-align:center;font-size:1.5rem;font-weight:400}
.menu li{opacity:0;transform:translateY(-.75rem);transition:opacity .4s ease,transform .5s var(--ease-out);transition-delay:0s}
.menu-open .menu li{opacity:1;transform:none;transition-delay:calc(var(--i,0) * 50ms)}
.menu a{opacity:.75;transition:opacity .25s}
.menu a:hover,.menu a:focus-visible,.menu a[aria-current="page"]{opacity:1}
.menu__logo{width:clamp(7rem,22vh,12rem);height:auto;margin:0 auto clamp(1.5rem,5vh,3rem)}
.menu__langs{display:flex;justify-content:center;gap:1rem;margin-top:1rem}
.menu__langs [aria-disabled]{opacity:.4}

/* ---------- full-screen indexes (home, spectacles) ---------- */
.index{position:relative;isolation:isolate;min-height:100svh;display:flex;flex-direction:column;padding:0 var(--spacing) 6.75rem}
.index--home{justify-content:flex-end}
.index--prod{justify-content:center;align-items:center;text-align:center;padding-top:6rem}
.bgs{position:fixed;inset:-2rem;z-index:-1;pointer-events:none}
.bgs figure{position:absolute;inset:0}
.bgs img{width:100%;height:100%;object-fit:cover;filter:brightness(var(--bright,.75))}
.bgs--dim{--bright:.45}
.bgs--dark{--bright:.3}
.bgs .bg{opacity:0;filter:blur(2rem);transition:opacity .5s ease-in,filter 1s ease-in}
.bgs .bg.is-visible{opacity:1;filter:blur(0);transition-timing-function:ease-out}

.list li{margin:.15rem 0}
.index--prod .list li{margin:.5rem 0}
.list a{display:inline-block;font-size:clamp(2rem,6vw,3rem);opacity:.75;transition:opacity .25s linear,filter .25s linear}
.list a:hover,.list a:focus-visible{opacity:1}
.list:has(a:hover) a:not(:hover),.list:has(a:focus-visible) a:not(:focus-visible){filter:blur(.125rem)}
.list small{margin-left:.75rem;font-family:var(--body);font-weight:400;font-size:1rem;letter-spacing:0;vertical-align:.8em;white-space:nowrap}

.foot{padding:2rem var(--spacing);font-size:.75rem;opacity:.6;text-align:center}
.foot--pinned{position:absolute;left:0;right:0;bottom:0;text-align:left}

/* ---------- article pages (spectacle, compagnie) ---------- */
.phead{position:relative;height:100svh;overflow:hidden}
.phead::after{content:"";position:absolute;inset:auto 0 0 0;z-index:1;height:40%;background:linear-gradient(transparent,rgba(0,0,0,.55));pointer-events:none}
.phead figure{position:absolute;inset:0}
.phead img{width:100%;height:100%;object-fit:cover;animation:settle 1.6s var(--ease-out) both}
.phead hgroup{position:absolute;left:0;bottom:0;z-index:2;max-width:100%;padding:1rem;opacity:.75}
.phead hgroup p{margin-top:.25rem;font-size:clamp(1rem,2.5vw,1.5rem)}
.phead figcaption{position:absolute;right:0;bottom:0;z-index:2;padding:1rem;font-size:.875rem;opacity:.8}
/* scroll hint: a thin line with a light running down it, gone as soon as you scroll */
.hint{position:absolute;right:1rem;bottom:1rem;z-index:2;display:flex;flex-direction:column;align-items:center;gap:.6rem;font-size:.8125rem;font-weight:400;letter-spacing:.25em;text-transform:uppercase;opacity:.9;transition:opacity .4s ease}
.hint:hover,.hint:focus-visible{opacity:1}
.hint__line{position:relative;width:1px;height:4rem;overflow:hidden;background:rgba(255,255,255,.45)}
.hint__line::after{content:"";position:absolute;left:0;top:-40%;width:100%;height:40%;background:var(--front);animation:drip 2s var(--ease-out) infinite}
@keyframes drip{from{top:-40%}to{top:100%}}
.hint--gone{opacity:0;pointer-events:none}
.phead figcaption + .hint,.phead .hint:has(+ figcaption){bottom:3rem}
@media (min-width:48em){.hint{right:auto;left:50%;transform:translateX(-50%)}}
@media (max-width:47.99em){.phead hgroup{padding-right:4.5rem}}
.hint > *{animation:fadein 1s ease 1s both}

.wrap{width:100%;max-width:56rem;margin-inline:auto;padding-inline:var(--spacing)}
.wrap--wide{max-width:96rem}
.section{margin-block:var(--leading)}
.phead + .section{margin-top:calc(var(--leading) * 1.5)}
.punch{font-size:clamp(1.5rem,3.5vw,2.5rem);font-weight:400;line-height:1.25;opacity:.75;text-wrap:balance}
.punch cite{display:block;margin-top:1rem;font-size:1rem;font-style:normal;opacity:.8}
.wide{aspect-ratio:16/9;overflow:hidden;background:#050505}
.wide img{width:100%;height:100%;object-fit:contain}
.prose{display:grid;gap:1rem;font-size:1.0625rem;line-height:1.5}
.prose--justify{text-align:justify;hyphens:auto}
.prose strong,.infos b{font-weight:500}
.label{margin-bottom:.5rem;font-size:1.25rem;font-weight:400;text-transform:uppercase}
.infos{display:grid;gap:.35rem;line-height:1.5}
.back{display:inline-block;margin-top:2rem;opacity:.75}
.back:hover,.back:focus-visible{opacity:1}

.slider__items{display:flex;gap:1rem;overflow-x:auto;scroll-snap-type:x mandatory;padding-inline:var(--spacing);scrollbar-width:none}
.slider__items::-webkit-scrollbar{display:none}
.slide{flex:0 0 auto;scroll-snap-align:center}
.slide img{width:auto;max-width:none;height:min(66vh,38rem)}
.slider__nav{display:flex;justify-content:flex-end;gap:1.5rem;padding:1rem var(--spacing) 0}
.slider__nav button{width:2.5rem;font-size:2.5rem;line-height:1;opacity:.75}
.slider__nav button:hover,.slider__nav button:focus-visible{opacity:1}

/* ---------- tables (dates, team) ---------- */
.table-wrap{overflow-x:auto}
.events{width:100%;border-collapse:collapse;border-top:.125rem solid var(--front);font-variant-numeric:tabular-nums}
.events td{padding:1rem .5rem;border-bottom:.0625rem solid var(--front);font-size:1.25rem;vertical-align:middle}
.events td:first-child{width:15rem;padding-left:0;white-space:nowrap}
.events td:last-child{padding-right:0;text-align:right}
.events .ev-title{font-size:1.5rem;font-weight:400}
.events .ev-title a{transition:opacity .25s}
.events .ev-title a:hover{opacity:.75}
.events--team td:first-child{width:auto}
.events--team td:last-child{font-size:1.125rem}
@media (max-width:40em){
  .events,.events tbody,.events tr,.events td{display:block;width:auto}
  .events tr{padding:1rem 0;border-bottom:.0625rem solid var(--front)}
  .events td,.events td:first-child,.events td:last-child{width:auto;padding:0;border:0;text-align:left}
  .events td + td{margin-top:.25rem}
}
.empty{padding:2rem 0;border-bottom:.0625rem solid var(--front);font-size:1.25rem}

/* ---------- pills ---------- */
.pills{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:2rem}
.pill{padding:.5rem 1rem;border:.0625rem solid var(--front);border-radius:2rem;font-size:1rem;font-weight:400;transition:background-color .2s,color .2s}
.pill:hover,.pill:focus-visible,.pill[aria-pressed="true"]{background:var(--front);color:var(--back)}
select.pill{appearance:none;padding-right:2.25rem;background:transparent linear-gradient(45deg,transparent 50%,currentColor 50%) calc(100% - 1.1rem) 55%/.3rem .3rem no-repeat,linear-gradient(135deg,currentColor 50%,transparent 50%) calc(100% - .8rem) 55%/.3rem .3rem no-repeat}
select.pill:hover,select.pill:focus-visible{background-color:transparent;color:var(--front)}
select.pill option{background:var(--back);color:var(--front)}

/* ---------- listing pages (agenda, galerie) ---------- */
.page{position:relative;isolation:isolate;min-height:100svh;padding-top:7rem;padding-bottom:2rem}

.cols{display:grid;grid-template-columns:1fr;gap:var(--spacing)}
@media (min-width:48em){.cols{grid-template-columns:1fr 1fr}}
.cols h2{font-size:clamp(1.5rem,3vw,2rem);opacity:.75}
.cols p{margin-top:.5rem;line-height:1.5}
.cols .sub{font-size:1.25rem;font-weight:400}

.gallery{columns:3 18rem;column-gap:1rem;margin-top:2rem}
.gallery figure{margin-bottom:1rem;break-inside:avoid}
.gallery button{display:block;width:100%;cursor:zoom-in}
.gallery img{width:100%;height:auto;transition:opacity .25s;animation:fadein .6s ease both}
.gallery button:hover img,.gallery button:focus-visible img{opacity:.85}
.gallery figcaption{padding:.35rem .25rem;font-size:.75rem;opacity:.75}

.lightbox{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:3.5rem 1rem 2.5rem;background:rgba(0,0,0,.94);animation:fadein .3s ease both}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.lb-close{position:absolute;top:calc(1rem + var(--safe-top));right:1rem;padding:.35rem .9rem;border:.0625rem solid var(--front);border-radius:2rem}
.lb-prev,.lb-next{position:absolute;top:50%;transform:translateY(-50%);padding:1rem;font-size:3rem;opacity:.75}
.lb-prev{left:0}
.lb-next{right:0}
.lb-cap{position:absolute;left:0;right:0;bottom:1rem;text-align:center;font-size:.875rem;opacity:.75}

.contact{position:relative;isolation:isolate;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:7rem var(--spacing) 5rem;text-align:center}
.contact__inner{display:grid;justify-items:center;gap:1.25rem}
.contact__lead{font-size:1.25rem;opacity:.75;--o:.75}
.contact__mail{font-size:clamp(1.25rem,3vw,2rem);font-weight:400;word-break:break-word}
.contact .pills{justify-content:center;margin-top:1rem}

/* ---------- motion ---------- */
/* page change: the new page fades in on top of the old one, photo to photo, never through black */
.view{position:relative;z-index:1;background:var(--back);transition:opacity .7s ease}
.view--entering{opacity:0}
.view--leaving{position:fixed;left:0;right:0;z-index:0;pointer-events:none}
/* each block glides down into place, one after another */
.rise{animation:rise .8s var(--ease-out) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(-1.25rem)}to{opacity:var(--o,1);transform:none}}
@keyframes settle{from{transform:scale(1.06)}to{transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>

// intrinsic sizes of the photos in img/ (width, height), used for srcset and to reserve space
const DIMS = { "affiche-choeur": [1080, 1531], "affiche-fsv": [741, 970], "affiche-inedit-2": [322, 462], "affiche-inedit": [800, 999], "affiche-par-endroits": [846, 1066], "bleu": [1080, 1587], "choeur-chemise": [2000, 1333], "choeur-duo": [2000, 1333], "choeur-jean": [1200, 1800], "groupe": [2048, 1365], "noir-blanc": [1197, 1800], "pull": [726, 1052], "rose": [1222, 2048], "script": [1080, 1616], "sourire": [1200, 1800], "trio": [1080, 1307], "vert": [1200, 1800] };

// <img> with a WebP srcset (960 px for phones, full size for large screens) and real dimensions
function pic(name, { alt = "", sizes = "100vw", eager = false, cls = "", style = "", deferred = false } = {}){
  const [w, h] = DIMS[name];
  const set = w > 960 ? `img/${name}-960.webp 960w, img/${name}.webp ${w}w` : `img/${name}.webp ${w}w`;
  const load = eager ? `fetchpriority="high"` : deferred ? "" : `loading="lazy"`;
  const src = deferred ? `data-srcset="${set}" data-src="img/${name}.jpg"` : `srcset="${set}" src="img/${name}.jpg"`;
  return `<img ${cls ? `class="${cls}" ` : ""}${src} sizes="${sizes}" width="${w}" height="${h}" alt="${esc(alt)}" ${load} decoding="async"${style ? ` style="${style}"` : ""}>`;
}
// fetch the hover backdrops once the page is idle, so hovering a title shows its photo instantly
function warm(scope){
  const go = () => scope.querySelectorAll("img[data-srcset]").forEach(i => { i.srcset = i.dataset.srcset; i.src = i.dataset.src; i.removeAttribute("data-srcset"); });
  "requestIdleCallback" in window ? requestIdleCallback(go, { timeout: 2500 }) : setTimeout(go, 1200);
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const bySlug = slug => SHOWS.find(s => s.slug === slug);
const today = () => new Date().toISOString().slice(0, 10);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

const dayFmt = new Intl.DateTimeFormat("fr-BE", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
const dayParts = iso => Object.fromEntries(dayFmt.formatToParts(new Date(iso + "T00:00:00Z")).map(p => [p.type, p.value]));
const fmtDay = iso => { const p = dayParts(iso); return `${p.day} ${p.month} ${p.year}`; };
const fmtTime = t => t ? t.replace(":", "h") : "";
function fmtRange(a, b){
  if (a === b) return fmtDay(a);
  const A = dayParts(a), B = dayParts(b);
  const days = Math.round((new Date(b) - new Date(a)) / 864e5);
  const joint = days === 1 ? "et" : "au"; // "17 et 18 avr." for two nights, "24 au 26 mai" for a longer run
  if (A.year !== B.year) return `${fmtDay(a)} ${joint} ${fmtDay(b)}`;
  if (A.month !== B.month) return `${A.day} ${A.month} ${joint} ${B.day} ${B.month} ${B.year}`;
  return `${A.day} ${joint} ${B.day} ${B.month} ${B.year}`;
}
const place = d => [d.venue, d.city].filter(Boolean).join(", ");

// consecutive performances of one show in one venue become one agenda line
function runs(){
  const out = [];
  for (const s of SHOWS) for (const d of s.dates) {
    const last = out[out.length - 1];
    const next = last && last.show === s && last.venue === d.venue && (new Date(d.day) - new Date(last.to)) <= 864e5;
    if (next) last.to = d.day;
    else out.push({ show: s, from: d.day, to: d.day, venue: d.venue, place: place(d), country: d.country });
  }
  return out.sort((x, y) => y.from.localeCompare(x.from));
}

// home & spectacles: hovering a title fades its photo in behind the list
function hoverBackdrops(view){
  const figs = view.querySelectorAll(".bg");
  const show = slug => figs.forEach(f => {
    const on = f.dataset.for === slug, i = f.querySelector("img[data-srcset]");
    if (on && i) { i.srcset = i.dataset.srcset; i.src = i.dataset.src; i.removeAttribute("data-srcset"); }
    f.classList.toggle("is-visible", on);
  });
  warm(view);
  view.querySelectorAll("[data-bg]").forEach(a => {
    a.addEventListener("mouseenter", () => show(a.dataset.bg));
    a.addEventListener("focus", () => show(a.dataset.bg));
    a.addEventListener("mouseleave", () => show(null));
    a.addEventListener("blur", () => show(null));
  });
}

// entrance: each block glides down into place, one after another
const REVEAL = ".list li, .phead hgroup > *, .title--page, .pills, .section, .cols > div, .gallery figure, .contact__inner > *";
function reveal(scope, sel = REVEAL, step = .07, start = .1){
  if (reduceMotion.matches) return;
  scope.querySelectorAll(sel).forEach((el, i) => {
    el.classList.remove("rise"); void el.offsetWidth; // restart the animation
    el.style.setProperty("--d", Math.min(start + i * step, .9) + "s");
    el.classList.add("rise");
  });
}

// big photo at the top of a page blurs as you scroll past it
let scrollTick = false;
addEventListener("scroll", () => {
  if (scrollTick || reduceMotion.matches) return;
  scrollTick = true;
  requestAnimationFrame(() => {
    scrollTick = false;
    document.querySelectorAll(".view:last-child .js-hint").forEach(h => h.classList.toggle("hint--gone", scrollY > 40));
    const hero = document.querySelector(".view:last-child .js-hero");
    if (!hero) return;
    const p = Math.min(1, Math.max(0, (scrollY / innerHeight - .5) * 2));
    hero.style.filter = p ? `blur(${(p * 2).toFixed(2)}rem)` : "";
  });
}, { passive: true });

// menu
const burger = document.getElementById("burger");
const menu = document.getElementById("menu");
const menuVideo = document.getElementById("menuVideo");
function setMenu(open){
  document.body.classList.toggle("menu-open", open);
  burger.setAttribute("aria-expanded", open);
  burger.setAttribute("aria-label", open ? "Fermer le menu" : "Ouvrir le menu");
  if (open) {
    if (!reduceMotion.matches) menuVideo.play().catch(() => {});
    menu.querySelector("a").focus({ preventScroll: true });
  } else {
    setTimeout(() => { if (!document.body.classList.contains("menu-open")) menuVideo.pause(); }, 300);
  }
}
// a link to the page already shown fires no hashchange, so close the menu on every click
menu.querySelectorAll("a").forEach(a => a.addEventListener("click", () => setMenu(false)));

// keep Tab inside the open menu or lightbox
function trapTab(e, focusables){
  const f = focusables.filter(n => n.getClientRects().length);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

burger.addEventListener("click", () => {
  const open = !document.body.classList.contains("menu-open");
  setMenu(open);
  if (!open) burger.focus();
});

// lightbox
const lightbox = (() => {
  const box = document.getElementById("lightbox"), pic = document.getElementById("lbImg"), cap = document.getElementById("lbCap");
  let set = [], pos = 0, returnTo = null;
  const draw = () => { const g = GALLERY[set[pos]]; pic.src = `img/${g[0]}.webp`; pic.alt = g[1]; cap.textContent = `${g[1]} · ${pos + 1} / ${set.length}`; };
  const step = d => { pos = (pos + d + set.length) % set.length; draw(); };
  document.getElementById("lbClose").addEventListener("click", () => api.close());
  document.getElementById("lbPrev").addEventListener("click", () => step(-1));
  document.getElementById("lbNext").addEventListener("click", () => step(1));
  box.addEventListener("click", e => { if (e.target === box) api.close(); });
  const api = {
    get isOpen(){ return !box.hidden; },
    open(i, ids){ returnTo = document.activeElement; set = ids; pos = ids.indexOf(i); draw(); box.hidden = false; document.getElementById("lbClose").focus(); },
    close(){ box.hidden = true; returnTo?.focus(); },
    step,
  };
  return api;
})();

document.addEventListener("keydown", e => {
  if (e.key === "Tab") {
    if (lightbox.isOpen) trapTab(e, [...document.querySelectorAll("#lightbox button")]);
    else if (document.body.classList.contains("menu-open")) trapTab(e, [burger, ...menu.querySelectorAll("a")]);
    return;
  }
  if (lightbox.isOpen) {
    if (e.key === "Escape") lightbox.close();
    if (e.key === "ArrowRight") lightbox.step(1);
    if (e.key === "ArrowLeft") lightbox.step(-1);
  } else if (e.key === "Escape" && document.body.classList.contains("menu-open")) {
    setMenu(false); burger.focus();
  }
});

/* =========================================================================
   NAVIGATION: the old page stays frozen underneath while the new one fades in
   ========================================================================= */

history.scrollRestoration = "manual";

function route(){
  const [name, param] = location.hash.replace(/^#\/?/, "").split("/");
  const render = pages[name] ? pages[name] : pages.home;
  setMenu(false);

  host.querySelectorAll("noscript, .view--leaving").forEach(n => n.remove());
  const old = host.querySelector(".view");
  if (old) {
    old.classList.add("view--leaving");
    old.style.top = `${-scrollY}px`;
  }

  const view = document.createElement("div");
  view.className = "view" + (old && !reduceMotion.matches ? " view--entering" : "");
  host.appendChild(view);
  const pageTitle = render(view, param);
  if (!view.firstChild) return; // redirected
  document.title = pageTitle ? `${pageTitle} · Compagnie Cliffhanger` : "Compagnie Cliffhanger";
  document.querySelectorAll(".menu a").forEach(a => a.toggleAttribute("aria-current", a.getAttribute("href") === `#/${name}`));
  document.querySelector(".menu a[aria-current]")?.setAttribute("aria-current", "page");
  scrollTo(0, 0);
  reveal(view);
  view.querySelectorAll(".js-hint").forEach(h => h.addEventListener("click", () =>
    view.querySelector(".phead + .section")?.scrollIntoView({ behavior: reduceMotion.matches ? "auto" : "smooth" })));

  if (!old) return;
  if (reduceMotion.matches) { old.remove(); return; }
  requestAnimationFrame(() => requestAnimationFrame(() => view.classList.remove("view--entering")));
  setTimeout(() => old.remove(), 800);
}
addEventListener("hashchange", route);
route();
</script>
</body>
</html>

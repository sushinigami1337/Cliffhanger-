<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/favicon.png">
<link rel="preload" href="fonts/jost-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/archivo-800-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" as="image" href="img/groupe-960.webp" imagesrcset="img/groupe-960.webp 960w, img/groupe-1440.webp 1440w, img/groupe.webp 2048w" imagesizes="100vw" fetchpriority="high">

<body>

<a class="skip" href="#app" onclick="document.getElementById('app').focus();return false">Aller au contenu</a>
<header class="mh">
  <a href="#/" class="mh__logo" translate="no">Compagnie Cliffhanger</a>
</header>
<button class="burger" id="burger" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="menu">
  <svg viewBox="0 0 32 32" aria-hidden="true"><rect class="s1" y="4" width="32" height="4"/><rect class="s2" y="14" width="32" height="4"/><rect class="s3" y="24" width="32" height="4"/></svg>
</button>
<nav class="menu" id="menu" aria-label="Menu principal">
  <video class="menu__bg" id="menuVideo" muted loop playsinline preload="none" data-poster="img/menu-poster.webp" aria-hidden="true">
    <source src="img/menu.mp4" type="video/mp4">
  </video>
  <ul>
    <li style="--i:0" aria-hidden="true"><img class="menu__logo" data-src="img/logo-arc-en-ciel.webp" alt="" width="384" height="384"></li>
    <li style="--i:1"><a href="#/compagnie">La compagnie</a></li>
    <li style="--i:2"><a href="#/spectacles">Spectacles</a></li>
    <li style="--i:3"><a href="#/agenda">Agenda</a></li>
    <li style="--i:4"><a href="#/galerie">Galerie</a></li>
    <li style="--i:5"><a href="#/montreal">Montréal</a></li>
    <li style="--i:6"><a href="#/contact">Contact</a></li>
  </ul>
</nav>

<main id="app" tabindex="-1">
  <p class="v-h" id="live" aria-live="polite"></p>
  <noscript>
    <div class="contact"><div class="contact__inner">
      <p class="title title--xl title--page">Compagnie Cliffhanger</p>
      <p class="contact__lead">Compagnie de théâtre bruxelloise</p>
      <p class="contact__mail"><a href="mailto:compagnie.cliffhanger@gmail.com">compagnie.cliffhanger@gmail.com</a></p>
    </div></div>
  </noscript>
</main>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo agrandie">
  <button class="lb-close" id="lbClose">Fermer</button>
  <button class="lb-prev" id="lbPrev" aria-label="Photo précédente">‹</button>
  <img id="lbImg" alt="">
  <button class="lb-next" id="lbNext" aria-label="Photo suivante">›</button>
  <p class="lb-cap" id="lbCap"></p>
</div>

<script src="js/content.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>

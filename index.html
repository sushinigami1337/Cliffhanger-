<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Compagnie Cliffhanger — compagnie de théâtre entre Bruxelles et Montréal.">
<meta property="og:title" content="Compagnie Cliffhanger">
<meta property="og:image" content="https://compagnie-cliffhanger.netlify.app/img/groupe.jpg">
<meta property="og:description" content="Compagnie de théâtre entre Bruxelles et Montréal.">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/favicon.png">
<style>html,body{margin:0;height:100%}*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}</style>
<title>Compagnie Cliffhanger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Jost:wght@300;400;500&display=swap">
<style>
:root{
  color-scheme:dark;
  --back:#000; --front:#fff; --muted:#7d7d7d;
  --spacing:1rem; --leading:1rem;
  --display:"Archivo","Arial Black","Helvetica Neue",sans-serif;
  --body:"Jost","Futura","Century Gothic","Trebuchet MS",sans-serif;
  --safe-top:env(safe-area-inset-top,0px);
}
@media (min-width:48em){:root{--spacing:2rem;--leading:2rem}}
@media (min-width:64em){:root{--spacing:3rem;--leading:4rem}}
@media (min-width:80em){:root{--spacing:4rem}}
html,body{background:var(--back);color:var(--front)}
body{font-family:var(--body);font-weight:300;line-height:1.25;font-size:100%;min-height:100%;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
ul{list-style:none;margin:0;padding:0}
h1,h2,h3,p,blockquote,figure{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:.125rem dotted var(--muted);outline-offset:.2rem;border-radius:.25rem}
img{display:block;max-width:100%}

.title{font-family:var(--display);font-weight:800;letter-spacing:.1875em;text-transform:uppercase;line-height:1.15;text-wrap:balance}

/* header */
.mh{position:absolute;top:0;left:0;right:0;z-index:20;padding:calc(1rem + var(--safe-top)) 1rem 1rem var(--spacing);pointer-events:none}
.mh__logo{pointer-events:auto;display:inline-block;max-width:14rem;font-size:1.5rem;font-weight:300;letter-spacing:.25em;text-transform:uppercase;opacity:.75;line-height:1.2;transition:opacity .25s linear}
.mh__logo:hover,.mh__logo:focus-visible{opacity:1}
.burger{position:fixed;right:1rem;top:calc(1rem + var(--safe-top));z-index:40;width:1.75rem;height:1.75rem;padding:.125rem;opacity:.75;pointer-events:auto;transition:opacity .25s linear}
.burger:hover,.burger:focus-visible{opacity:1}
.burger svg{width:1.5rem;height:1.5rem;display:block}
.burger rect{fill:currentColor;transition:transform .3s ease,opacity .1s ease}
.s1{transform-origin:2px 6px}.s3{transform-origin:2px 26px}
.menu-open .s1{transform:translateX(4px) rotate(45deg)}
.menu-open .s2{opacity:0}
.menu-open .s3{transform:translateX(4px) rotate(-45deg)}
.menu{position:fixed;inset:0;z-index:30;background:var(--back);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .25s linear,visibility .25s linear;padding:2rem 1rem}
.menu-open .menu{opacity:1;visibility:visible}
.menu{isolation:isolate}
.menu__bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.4);z-index:-1;pointer-events:none}
.menu ul{position:relative}
.menu__logo-item{margin-bottom:clamp(1.5rem,5vh,3rem)}
.menu__logo{width:clamp(7rem,22vh,12rem);height:auto;margin-inline:auto;filter:drop-shadow(0 0 1.5rem rgba(0,0,0,.35))}
.menu-open .menu li:nth-child(7){transition-delay:.3s}
.menu ul{text-align:center;font-size:1.5rem;font-weight:400;display:grid;gap:.5rem}
.menu a{opacity:.75;transition:opacity .25s}
.menu a:hover,.menu a:focus-visible,.menu a[aria-current="page"]{opacity:1}
.menu .langs{margin-top:1rem;display:flex;gap:1rem;justify-content:center}
.menu .langs span[aria-disabled]{opacity:.4}
body.menu-open{overflow:hidden}

/* full-screen index (home / spectacles) */
.index{position:relative;min-height:100svh;display:flex;flex-direction:column;padding:0 var(--spacing) 6.75rem;isolation:isolate}
.index--home{justify-content:flex-end}
.index--prod{justify-content:center;align-items:center;text-align:center;padding-top:6rem}
.bgs{position:fixed;inset:-2rem;z-index:-1;pointer-events:none}
.bgs figure{position:absolute;inset:0}
.bgs img{width:100%;height:100%;object-fit:cover;filter:brightness(.75)}
.bgs .bg{opacity:0;filter:blur(2rem);transition:opacity .5s ease-in,filter 1s ease-in}
.bgs .bg.is-visible{opacity:1;filter:blur(0);transition-timing-function:ease-out}
.bgs--dim img{filter:brightness(.45)}
.bgs--dark img{filter:brightness(.3)}
.list{z-index:1}
.list li{margin:.15rem 0}
.index--prod .list li{margin:.5rem 0}
.list a{display:inline-block;opacity:.75;transition:opacity .25s linear,filter .25s linear;font-size:clamp(2rem,6vw,3rem)}
.list a:hover,.list a:focus-visible{opacity:1}
.list:has(a:hover) a:not(:hover),.list:has(a:focus-visible) a:not(:focus-visible){filter:blur(.125rem)}
.list small{font-family:var(--body);font-weight:400;font-size:1rem;letter-spacing:0;margin-left:.75rem;vertical-align:.8em;white-space:nowrap}

.foot{font-size:.75rem;opacity:.6;padding:2rem var(--spacing);text-align:center}
.index .foot{position:absolute;left:0;right:0;bottom:0;text-align:left}

/* production / page */
.phead{position:relative;height:100svh;overflow:hidden}
.phead figure{position:absolute;inset:0}
.phead img{width:100%;height:100%;object-fit:cover;will-change:filter}
.phead hgroup{position:absolute;left:0;bottom:0;padding:1rem;opacity:.75;z-index:2;max-width:100%}
.phead hgroup .title{font-size:clamp(2rem,6vw,3rem)}
.phead hgroup p{font-size:clamp(1rem,2.5vw,1.5rem);margin-top:.25rem}
.phead figcaption{position:absolute;right:0;bottom:0;padding:1rem;font-size:.875rem;opacity:.8;z-index:2}
.phead::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(transparent,rgba(0,0,0,.55));z-index:1;pointer-events:none}

.wrap{margin-inline:auto;width:100%;max-width:56rem;padding-inline:var(--spacing)}
.wrap--96{max-width:96rem}
.section{margin-block:var(--leading)}
.section:first-of-type{margin-top:calc(var(--leading) * 1.5)}
.punch{font-size:clamp(1.5rem,3.5vw,2.5rem);font-weight:400;line-height:1.25;opacity:.75;text-wrap:balance}
.punch cite{display:block;font-style:normal;font-size:1rem;margin-top:1rem;opacity:.8}
.wide{aspect-ratio:16/9;background:#050505;overflow:hidden}
.wide img{width:100%;height:100%;object-fit:contain}
.cke{line-height:1.5;font-size:1.0625rem;display:grid;gap:1rem}
.cke--body{text-align:justify;hyphens:auto}
.cke strong{font-weight:500}
.cke em{font-style:italic}
.label{font-size:1.25rem;text-transform:uppercase;margin-bottom:.5rem;font-weight:400}

.slider{position:relative}
.slider__items{display:flex;gap:1rem;overflow-x:auto;scroll-snap-type:x mandatory;padding-inline:var(--spacing);scrollbar-width:none}
.slider__items::-webkit-scrollbar{display:none}
.slide{flex:0 0 auto;scroll-snap-align:center}
.slide img{height:min(66vh,38rem);width:auto;max-width:none}
.slider__nav{display:flex;justify-content:flex-end;gap:1.5rem;padding:1rem var(--spacing) 0}
.slider__nav button{font-size:2.5rem;line-height:1;opacity:.75;width:2.5rem}
.slider__nav button:hover,.slider__nav button:focus-visible{opacity:1}
.note{font-size:.875rem;opacity:.6;padding-inline:var(--spacing);margin-top:.75rem}

.infos{display:grid;gap:.35rem;line-height:1.5}
.infos b{font-weight:500}
.file{opacity:.6}

.events{border-top:.125rem solid var(--front);width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.events td{border-bottom:.0625rem solid var(--front);padding:1rem .5rem;font-size:1.25rem;vertical-align:middle}
.events td:first-child{padding-left:0;width:15rem;white-space:nowrap}
.events td:last-child{padding-right:0;text-align:right}
.events .ev-title{font-size:1.5rem;font-weight:400}
.events .ev-title a{transition:opacity .25s}
.events .ev-title a:hover{opacity:.75}
.events-wrap{overflow-x:auto}
@media (max-width:40em){
  .events,.events tbody,.events tr,.events td{display:block;width:auto}
  .events tr{border-bottom:.0625rem solid var(--front);padding:1rem 0}
  .events td{border:0;padding:0;text-align:left!important;width:auto!important}
  .events td+td{margin-top:.25rem}
}
.empty{padding:2rem 0;font-size:1.25rem;border-bottom:.0625rem solid var(--front)}

.pills{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:2rem}
.pill{border:.0625rem solid var(--front);border-radius:2rem;padding:.5rem 1rem;font-size:1rem;font-weight:400;transition:background-color .2s,color .2s}
.pill:hover,.pill:focus-visible,.pill[aria-pressed="true"]{background:var(--front);color:var(--back)}
select.pill{appearance:none;background:transparent;padding-right:2.25rem;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 1.1rem) 55%,calc(100% - .8rem) 55%;background-size:.3rem .3rem;background-repeat:no-repeat}
select.pill:hover{background-color:transparent;color:var(--front)}
select.pill option{background:#000;color:#fff}

.page{position:relative;min-height:100svh;padding-top:7rem;padding-bottom:2rem;isolation:isolate}
.page .title--page{font-size:clamp(2rem,6vw,3rem);opacity:.75}

.cols{display:grid;gap:var(--spacing);grid-template-columns:1fr}
@media (min-width:48em){.cols{grid-template-columns:1fr 1fr}}
.cols h2{font-size:clamp(1.5rem,3vw,2rem);opacity:.75}
.cols p{line-height:1.5;margin-top:.5rem}
.cols .sub{font-size:1.25rem;font-weight:400;margin-top:.5rem}

.team td:last-child{font-size:1.125rem}
.team td:first-child{width:auto}

.gallery{columns:3 18rem;column-gap:1rem;margin-top:2rem}
.gallery figure{break-inside:avoid;margin-bottom:1rem;cursor:zoom-in;position:relative}
.gallery button{display:block;width:100%}
.gallery img{width:100%;height:auto;transition:opacity .25s}
.gallery button:hover img{opacity:.85}
.gallery figcaption{font-size:.75rem;padding:.35rem .25rem;opacity:.75;text-align:left}

.lightbox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;padding:3.5rem 1rem 2.5rem}
.lightbox img{max-height:100%;max-width:100%;object-fit:contain}
.lightbox .lb-close{position:absolute;top:calc(1rem + var(--safe-top));right:1rem;font-size:1rem;border:.0625rem solid var(--front);border-radius:2rem;padding:.35rem .9rem}
.lightbox .lb-prev,.lightbox .lb-next{position:absolute;top:50%;transform:translateY(-50%);font-size:3rem;opacity:.75;padding:1rem}
.lightbox .lb-prev{left:0}.lightbox .lb-next{right:0}
.lightbox .lb-cap{position:absolute;left:0;right:0;bottom:1rem;text-align:center;font-size:.875rem;opacity:.75}

.contact{position:relative;min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;padding:7rem var(--spacing) 5rem;isolation:isolate}
.contact .inner{display:grid;gap:1.25rem;justify-items:center}
.contact .mail{font-size:clamp(1.25rem,3vw,2rem);font-weight:400;word-break:break-word;user-select:all}
.contact .pills{justify-content:center;margin-top:1rem}
.back{display:inline-block;margin-top:2rem;opacity:.75;font-size:1rem}
.back:hover{opacity:1}

/* page transitions: fade out, then the new page fades in while its content glides down into place */
/* crossfade: the new page fades in on top of the old one, photo to photo, never through black */
.view{position:relative;z-index:1;background:var(--back);transition:opacity .7s ease}
.view.enter{opacity:0}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(-1.25rem)}to{opacity:var(--o,1);transform:none}}
.title--page{--o:.75}
.phead img{animation:settle 1.6s cubic-bezier(.2,.7,.2,1) both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes settle{from{transform:scale(1.06)}to{transform:none}}
.menu li{opacity:0;transform:translateY(-.75rem);transition:opacity .4s ease,transform .5s cubic-bezier(.2,.7,.2,1)}
.menu-open .menu li{opacity:1;transform:none}
.menu-open .menu li:nth-child(2){transition-delay:.05s}.menu-open .menu li:nth-child(3){transition-delay:.1s}
.menu-open .menu li:nth-child(4){transition-delay:.15s}.menu-open .menu li:nth-child(5){transition-delay:.2s}.menu-open .menu li:nth-child(6){transition-delay:.25s}
.lightbox{animation:fadein .3s ease both}
.gallery img{animation:fadein .6s ease both}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>

];
const GALLERY = [
  ["groupe","L'Inédit de Molière","linedit-de-moliere"],["choeur-jean","Un C(h)œur silencieux","un-choeur-silencieux"],["bleu","L'Inédit de Molière","linedit-de-moliere"],
  ["choeur-duo","Un C(h)œur silencieux","un-choeur-silencieux"],["script","Coulisses","coulisses"],["choeur-chemise","Un C(h)œur silencieux","un-choeur-silencieux"],
  ["rose","Coulisses","coulisses"],["noir-blanc","Coulisses","coulisses"],["trio","Par Endroits","par-endroits"],
  ["vert","Coulisses","coulisses"],["sourire","Coulisses","coulisses"],["pull","Les Femmes Se Vantent","les-femmes-se-vantent"],
];
const TEAM = [["Alexandre Van Campenhout","auteur, metteur en scène, interprète"],["Alizé Cookie","mise en scène, interprète"],["Ildikó Ács","interprète"],["Audrey Colomb","interprète"],["Sophie Decaestecker","interprète"],["Julie Gloesener","interprète"],["Thomas Kesmarki","interprète"],["Nathan Leclercq","interprète"],["Hans Mélot","interprète"],["Hugo Ortiz","interprète"],["Laurie Stevens","interprète"]];

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bySlug = s => SHOWS.find(x => x.slug === s);
const host = document.getElementById("app");
let app = host; // points at the page currently being shown
const FOOT = `<p class="foot">© 2026 Compagnie Cliffhanger — Bruxelles · Montréal · maquette de travail</p>`;

function listMarkup(withYear){
  return `<ul class="list">${SHOWS.map(s => `<li><a href="#/spectacle/${s.slug}" class="title" data-bg="${s.slug}" translate="no">${esc(s.title)}${withYear ? `<small>${s.year}</small>` : ""}</a></li>`).join("")}</ul>`;
}
function bgsMarkup(base, cls=""){
  return `<div class="bgs ${cls}" aria-hidden="true">
    <figure><img src="${I(base)}" alt=""></figure>
    ${SHOWS.map(s => `<figure class="bg" id="bg_${s.slug}"><img src="${I(s.bg)}" alt="" style="object-position:${s.pos}"></figure>`).join("")}
  </div>`;
}
function wireHover(){
  app.querySelectorAll("[data-bg]").forEach(a => {
    const on = () => { app.querySelectorAll(".bg").forEach(b => b.classList.toggle("is-visible", b.id === "bg_" + a.dataset.bg)); };
    const off = () => app.querySelectorAll(".bg").forEach(b => b.classList.remove("is-visible"));
    a.addEventListener("mouseenter", on); a.addEventListener("focus", on);
    a.addEventListener("mouseleave", off); a.addEventListener("blur", off);
  });
}

const views = {
  home(){
    app.innerHTML = `<section class="index index--home">${bgsMarkup("groupe")}${listMarkup(false)}${FOOT}</section>`;
    wireHover();
  },
  spectacles(){
    app.innerHTML = `<section class="index index--prod">${bgsMarkup("rose","bgs--dim")}${listMarkup(true)}${FOOT}</section>`;
    wireHover();
  },
  spectacle(slug){
    const s = bySlug(slug); if (!s) return views.home();
    const upcoming = s.dates.filter(d => d[0] >= TODAY);
    app.innerHTML = `<article>
      <header class="phead"><figure><img id="heroImg" src="${I(s.hero)}" alt="${esc(s.title)}" style="object-position:${s.pos}"></figure>
        <hgroup><h1 class="title" translate="no">${esc(s.title)}</h1><p>${esc(s.by)} — ${s.year}</p></hgroup>
        <figcaption>© photo : à créditer</figcaption></header>
      <div class="section wrap"><blockquote class="punch"><p>${esc(s.punch)}</p>${s.cite ? `<cite>— ${esc(s.cite)}</cite>` : ""}</blockquote></div>
      ${s.wide ? `<div class="section wrap wrap--96"><figure class="wide"><img src="${I(s.wide)}" alt="Affiche de ${esc(s.title)}"></figure></div>` : ""}
      <div class="section wrap"><div class="cke cke--body">${s.text.map(p => `<p>${esc(p)}</p>`).join("")}<p><strong>${esc(s.strong)}</strong></p></div></div>
      <div class="section slider"><div class="slider__items" id="slides">${s.slides.map(([n,c]) => `<figure class="slide"><img src="${I(n)}" alt="${esc(c)}" loading="lazy"></figure>`).join("")}</div>
        ${s.note ? `<p class="note">${esc(s.note)}</p>` : ""}
        ${s.slides.length > 1 ? `<div class="slider__nav"><button data-dir="-1" aria-label="Photo précédente">‹</button><button data-dir="1" aria-label="Photo suivante">›</button></div>` : ""}</div>
      <div class="section wrap"><div class="infos">${s.infos.map(([k,v]) => `<p><b>${esc(k)} :</b> ${esc(v)}</p>`).join("")}</div>
        <p class="file" style="margin-top:1.5rem">Dossier de diffusion (PDF) — bientôt disponible</p></div>
      <div class="section wrap"><h2 class="label">${upcoming.length ? "À venir" : "Représentations passées"}</h2>
        <div class="events-wrap"><table class="events"><tbody>${s.dates.map(d => `<tr><td>${esc(d[1])}</td><td>${esc(d[2])}</td><td>${esc(d[3])}</td></tr>`).join("")}</tbody></table></div>
        <a class="back" href="#/spectacles">← Tous les spectacles</a></div>
      ${FOOT}</article>`;
    const track = document.getElementById("slides");
    app.querySelectorAll(".slider__nav button").forEach(b => b.addEventListener("click", () => track.scrollBy({left: track.clientWidth * 0.6 * +b.dataset.dir, behavior:"smooth"})));
  },
  agenda(){
    const years = [...new Set(AGENDA.map(e => e[0].slice(0,4)))];
    app.innerHTML = `<section class="page">${bgsMarkup("script","bgs--dark")}
      <div class="wrap wrap--96"><h1 class="title title--page">Agenda</h1>
        <div class="pills" role="group" aria-label="Filtrer par période">
          <button class="pill" data-f="upcoming" aria-pressed="false">À venir</button>
          <button class="pill" data-f="all" aria-pressed="true">Tout</button>
          ${years.map(y => `<button class="pill" data-f="${y}" aria-pressed="false">${y}</button>`).join("")}
          <label class="v-h" for="country" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Pays</label>
          <select class="pill" id="country"><option value="">Tous les pays</option><option>Belgique</option><option>Canada</option></select>
        </div>
        <div class="section" id="agendaList"></div>
      </div>${FOOT}</section>`;
    let f = "all";
    const render = () => {
      const c = document.getElementById("country").value;
      const rows = AGENDA.filter(e => (f === "all" || (f === "upcoming" ? e[0] >= TODAY : e[0].startsWith(f))) && (!c || e[4] === c));
      document.getElementById("agendaList").innerHTML = rows.length
        ? `<div class="events-wrap"><table class="events"><tbody>${rows.map(e => `<tr><td>${esc(e[1])}</td><td class="ev-title"><a href="#/spectacle/${e[2]}">${esc(bySlug(e[2]).title)}</a></td><td>${esc(e[3])}</td><td>${esc(e[4])}</td></tr>`).join("")}</tbody></table></div>`
        : `<p class="empty">Aucune date annoncée pour le moment. Les prochaines représentations arrivent bientôt.</p>`;
      stagger(document.getElementById("agendaList"), ".events tr, .empty", .05, 0);
    };
    app.querySelectorAll("[data-f]").forEach(b => b.addEventListener("click", () => { f = b.dataset.f; app.querySelectorAll("[data-f]").forEach(x => x.setAttribute("aria-pressed", x === b)); render(); }));
    document.getElementById("country").addEventListener("change", render);
    render();
  },
  compagnie(){
    app.innerHTML = `<article>
      <header class="phead"><figure><img id="heroImg" src="${I("choeur-chemise")}" alt="Un comédien en chemise rouge sur scène" style="object-position:60% 35%"></figure>
        <hgroup><h1 class="title">La compagnie</h1><p>Bruxelles · Montréal — depuis 2018</p></hgroup></header>
      <div class="section wrap"><blockquote class="punch"><p>Des univers inédits, des spectacles originaux, et 1001 sensations. Car la Compagnie Cliffhanger, c'est une histoire sans fin.</p></blockquote></div>
      <div class="section wrap"><div class="cke cke--body">
        <p>Créée en 2018 dans les locaux de l'ULB, unis par leur passion commune pour la littérature, le théâtre et l'improvisation, la Compagnie Cliffhanger s'est d'abord fait remarquer avec une adaptation audacieuse des <em>Femmes savantes</em> de Molière, réinventée à la manière d'une sitcom des années 1980.</p>
        <p>Après avoir traversé la crise du COVID, la troupe a retrouvé le chemin des planches avec <em>Par Endroits</em>, une création originale. Parallèlement, la compagnie s'est développée outre-Atlantique grâce à l'un de ses membres fondateurs, donnant naissance à un collectif-sœur au Québec, dont les liens perdurent aujourd'hui.</p>
        <p><strong>« Avancer plus loin, ensemble, au rythme de nos différences. »</strong></p></div></div>
      <div class="section wrap wrap--96"><div class="cols">
        <div><h2 class="title">Bruxelles</h2><p class="sub">Compagnie Cliffhanger — depuis 2018</p><p><em>Les Femmes Se Vantent</em> (2019), <em>Par Endroits</em> (2024), <em>L'Inédit de Molière</em> (2026).</p></div>
        <div><h2 class="title">Montréal</h2><p class="sub">Collectif Cliffhanger — collectif-sœur</p><p><em>Hamlet</em>, tragicomédie façon années 1950 (2020, interrompu par le Covid), <em>Un C(h)œur silencieux</em> (2025, Place des Arts).</p></div>
      </div></div>
      <div class="section wrap"><h2 class="label">L'équipe</h2>
        <div class="events-wrap"><table class="events team"><tbody>${TEAM.map(([n,r]) => `<tr><td>${esc(n)}</td><td>${esc(r)}</td></tr>`).join("")}</tbody></table></div></div>
      ${FOOT}</article>`;
  },
  galerie(){
    const cats = [["all","Tout"],["linedit-de-moliere","L'Inédit de Molière"],["un-choeur-silencieux","Un C(h)œur silencieux"],["par-endroits","Par Endroits"],["les-femmes-se-vantent","Les Femmes Se Vantent"],["coulisses","Coulisses"]];
    app.innerHTML = `<section class="page"><div class="wrap wrap--96"><h1 class="title title--page">Galerie</h1>
      <div class="pills" role="group" aria-label="Filtrer par spectacle">${cats.map(([k,l],i) => `<button class="pill" data-g="${k}" aria-pressed="${i===0}">${esc(l)}</button>`).join("")}</div>
      <div class="gallery" id="gallery"></div></div>${FOOT}</section>`;
    const draw = k => {
      const items = GALLERY.map((g,i) => [...g,i]).filter(g => k === "all" || g[2] === k);
      document.getElementById("gallery").innerHTML = items.map(([n,l,,i]) => `<figure><button data-i="${i}" aria-label="Agrandir : ${esc(l)}"><img src="${I(n)}" alt="${esc(l)}" loading="lazy"></button><figcaption>${esc(l)}</figcaption></figure>`).join("");
      document.querySelectorAll("#gallery [data-i]").forEach(b => b.addEventListener("click", () => openLb(+b.dataset.i, items.map(x => x[3]))));
      stagger(document.getElementById("gallery"), "figure", .05, 0);
    };
    app.querySelectorAll("[data-g]").forEach(b => b.addEventListener("click", () => { app.querySelectorAll("[data-g]").forEach(x => x.setAttribute("aria-pressed", x === b)); draw(b.dataset.g); }));
    draw("all");
  },
  contact(){
    app.innerHTML = `<section class="contact">${bgsMarkup("vert","bgs--dim")}
      <div class="inner"><h1 class="title title--page" style="font-size:clamp(2rem,6vw,3rem);opacity:.75">Contact</h1>
        <p style="opacity:.75;font-size:1.25rem">Réservations, diffusion, presse</p>
        <p class="mail">compagnie.cliffhanger@gmail.com</p>
        <div class="pills">
          <a class="pill" href="https://www.instagram.com/compagnie.cliffhanger/" target="_blank" rel="noopener">Instagram</a>
          <a class="pill" href="https://www.facebook.com/100057761165578/" target="_blank" rel="noopener">Facebook</a>
        </div></div>${FOOT.replace('class="foot"','class="foot" style="position:absolute;left:0;right:0;bottom:0"')}</section>`;
  },
};

/* lightbox */
const lb = document.getElementById("lightbox"), lbImg = document.getElementById("lbImg"), lbCap = document.getElementById("lbCap");
let lbSet = [], lbPos = 0, lbReturn = null;
function showLb(){ const g = GALLERY[lbSet[lbPos]]; lbImg.src = I(g[0]); lbImg.alt = g[1]; lbCap.textContent = `${g[1]} — ${lbPos+1} / ${lbSet.length}`; }
function openLb(i, set){ lbReturn = document.activeElement; lbSet = set; lbPos = set.indexOf(i); showLb(); lb.hidden = false; document.getElementById("lbClose").focus(); }
function closeLb(){ lb.hidden = true; lbReturn && lbReturn.focus(); }
document.getElementById("lbClose").onclick = closeLb;
document.getElementById("lbPrev").onclick = () => { lbPos = (lbPos - 1 + lbSet.length) % lbSet.length; showLb(); };
document.getElementById("lbNext").onclick = () => { lbPos = (lbPos + 1) % lbSet.length; showLb(); };
lb.addEventListener("click", e => { if (e.target === lb) closeLb(); });

/* menu */
const burger = document.getElementById("burger");
const menuVideo = document.getElementById("menuVideo");
function setMenu(open){
  document.body.classList.toggle("menu-open", open); burger.setAttribute("aria-expanded", open);
  if (open && !matchMedia("(prefers-reduced-motion: reduce)").matches) { menuVideo.play().catch(() => {}); }
  else if (!open) { setTimeout(() => { if (!document.body.classList.contains("menu-open")) menuVideo.pause(); }, 300); }
}
burger.addEventListener("click", () => setMenu(!document.body.classList.contains("menu-open")));
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (!lb.hidden) closeLb(); else setMenu(false); }
  if (!lb.hidden && e.key === "ArrowRight") document.getElementById("lbNext").click();
  if (!lb.hidden && e.key === "ArrowLeft") document.getElementById("lbPrev").click();
});

/* hero blur on scroll, like the reference */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
addEventListener("scroll", () => {
  const h = document.getElementById("heroImg"); if (!h || reduce) return;
  const p = Math.min(1, Math.max(0, (scrollY / innerHeight - .5) * 2));
  h.style.filter = p ? `blur(${(p * 2).toFixed(2)}rem)` : "";
}, {passive:true});

/* entrance: content glides down into place, one block after another */
function stagger(scope = app, sel = ".list li, .phead hgroup > *, .title--page, .pills, .section, .cols > div, .gallery figure, .contact .inner > *", step = .07, start = .1){
  if (reduce) return;
  scope.querySelectorAll(sel).forEach((el, i) => {
    el.classList.remove("rise"); void el.offsetWidth;
    el.style.setProperty("--d", Math.min(start + i * step, .9) + "s");
    el.classList.add("rise");
  });
}

/* router: the old page stays frozen underneath while the new one fades in over it */
function route(){
  const parts = (location.hash.replace(/^#\/?/, "") || "").split("/");
  setMenu(false);
  const v = parts[0];
  const all = host.querySelectorAll(".view");
  all.forEach((n, i) => { if (i < all.length - 1) n.remove(); });
  const old = all[all.length - 1];
  if (old) { old.style.cssText = `position:fixed;left:0;right:0;top:${-scrollY}px;z-index:0;pointer-events:none`; old.querySelectorAll("[id]").forEach(n => n.removeAttribute("id")); }
  const view = document.createElement("div");
  view.className = "view" + (old && !reduce ? " enter" : "");
  host.appendChild(view); app = view;
  if (v === "spectacle") views.spectacle(parts[1]);
  else if (views[v]) views[v]();
  else views.home();
  document.querySelectorAll(".menu a").forEach(a => a.getAttribute("href") === "#/" + v ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
  scrollTo(0, 0);
  stagger();
  if (old) {
    if (reduce) old.remove();
    else { requestAnimationFrame(() => requestAnimationFrame(() => view.classList.remove("enter"))); setTimeout(() => old.remove(), 800); }
  }
}
addEventListener("hashchange", route);
route();
</script>
